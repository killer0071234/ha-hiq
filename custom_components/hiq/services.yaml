alarm_event:
  name: Alarm clock event
  description: Sends the smartphone alarm clock event (alarm clock rings) to the HIQ controller.
  target:
    entity:
      integration: hiq
      domain:
       - binary_sensor
presence_signal:
  name: Presence signal
  description: Sends the smartphone presence signal to the HIQ controller.
  target:
    entity:
      integration: hiq
      domain:
       - binary_sensor
charge_on_event:
  name: Charge on event
  description: Sends the smartphone charge on event (charger connected) to the HIQ controller.
  target:
    entity:
      integration: hiq
      domain:
       - binary_sensor
charge_off_event:
  name: Charge off event
  description: Sends the smartphone charge off event (charger disconnected) to the HIQ controller.
  target:
    entity:
      integration: hiq
      domain:
       - binary_sensor
home_event:
  name: Home event
  description: Sends the smartphone home event to the HIQ controller.
  target:
    entity:
      integration: hiq
      domain:
       - binary_sensor
precede_event:
  name: Precede event
  description: Sends the smartphone event triggered some minutes before the alarm clock to the HIQ controller, e.g. to turn on the heating in advance.
  target:
    entity:
      integration: hiq
      domain:
       - binary_sensor
  fields:
    time:
      name: Precede time
      description: Minutes before the alarm clock at which the event is triggered.
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: "min"
write_tag:
  name: Write tag
  description: Writes a value to a variable of the HIQ controller.
  target:
    entity:
      integration: hiq
      domain:
       - binary_sensor
  fields:
    tag:
      name: Variable
      description: Name of the controller variable without the cNAD. prefix, e.g. smartphone_presence_signal.
      required: true
      example: "smartphone_presence_signal"
      selector:
        text:
    value:
      name: Value
      description: Value to write, e.g. 10. Negative and decimal values are allowed.
      required: true
      example: 10
      selector:
        number:
          min: -2147483648
          max: 2147483647
          step: any
          mode: box
